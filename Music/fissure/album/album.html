<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Archive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Courier Prime', 'Courier New', Courier, monospace;
      margin: 40px 0 40px 24px;
      padding: 0;
      max-width: 650px;
      line-height: 1.7;
      color: #1a1a1a;
      background-color: #f7f6f2;
    }
    h1 {
      font-size: 1.4rem;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #555;
      text-decoration: none;
      font-weight: bold;
    }
    .back-link:hover {
      text-decoration: underline;
      color: #000;
    }
    .track-entry {
      border-bottom: 1px dashed #bbb;
      padding: 14px 0;
      margin-bottom: 10px;
    }
    .track-title {
      font-weight: bold;
      font-size: 1.05rem;
      display: block;
      margin-bottom: 6px;
    }
    audio {
      width: 100%;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <a href="/index.html" class="back-link">← [ BACK TO DIRECTORY ]</a>

  <h1>self titled</h1>
  <p>our only studio album.</p>

  <!-- The list container where your 9 players will appear -->
  <div id="track-list"></div>

  <script>
    // 1. Paste your base R2 bucket link once (make sure it ends with a slash /)
    const BASE_URL = "https://pub-659b8242d078468eaa8762fd47284652.r2.dev/Fissure/Album/";

    // 2. Simply list your 9 tracks and their filenames here:
    const tracks = [
      { title: "fall away",   file: "01 Fall Away.mp3" },
      { title: "albino",   file: "02 albino.mp3" },
      { title: "fearing (the stranglehold)", file: "03 fearing (the stranglehold).mp3" },
      { title: "remind me",  file: "04 remind me.mp3" },
      { title: "eat, breathe, sleep, seethe",  file: "05 eat, breathe, sleep, seethe.mp3" },
      { title: "something",   file: "06 something.mp3" },
      { title: "haven", file: "07 haven.mp3" },
      { title: "tradgedy", file: "08 tradedy.mp3" },    
    ];

    // Automatically generates the 9 players on the screen
    const container = document.getElementById("track-list");
    tracks.forEach(track => {
      const entry = document.createElement("div");
      entry.className = "track-entry";
      entry.innerHTML = `
        <span class="track-title">${track.title}</span>
        <audio controls src="${BASE_URL}${track.file}"></audio>
      `;
      container.appendChild(entry);
    });
  </script>

</body>
</html>
